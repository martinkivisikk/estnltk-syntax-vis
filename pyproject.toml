[project]
name = "estnltk-syntax-vis"
version = "0.1.0"
description = "Dependency tree visualiser (SVG arc diagrams) for EstNLTK Text objects"
readme = "README.md"
authors = [
    { name = "Martin Kivisikk", email = "martin.kivisikk@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "estnltk>=1.7.5,<1.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["B018"]  # Jupyter shows a cell's last expression

[tool.pytest.ini_options]
testpaths = ["tests"]
